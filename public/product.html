<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>产品详情 · Atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237C5CFF'/%3E%3Cpath d='M8 11l8-4 8 4v10l-8 4-8-4V11z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>

<header class="nav is-scrolled" style="position:sticky">
  <div class="nav-inner">
    <a class="brand" href="/">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z"/><path d="M12 12l8-4.5M12 12v9M12 12 4 7.5"/></svg></span>
      <span class="brand-name">Atlas <em>/ 产品管理器</em></span>
    </a>
    <div class="nav-right">
      <a class="btn btn-sm btn-ghost" href="/app.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        返回产品库
      </a>
      <button class="btn btn-sm btn-primary" id="btn-add-top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        添加产品
      </button>
    </div>
  </div>
</header>

<main class="detail-wrap" id="detail">
  <div style="padding:120px 0;text-align:center;color:var(--dim);font-size:13px">
    <span class="spinner" style="display:inline-block;margin-right:8px;vertical-align:-2px"></span>加载产品信息…
  </div>
</main>

<div class="modal-mask" id="confirm-mask" style="align-items:center">
  <div class="modal" style="width:min(400px,100%)" role="alertdialog" aria-modal="true">
    <div class="modal-head">
      <div><h3>删除产品</h3><p id="confirm-desc">此操作无法撤销</p></div>
    </div>
    <div class="modal-foot">
      <div class="spacer"></div>
      <button class="btn btn-sm" type="button" data-close="confirm">取消</button>
      <button class="btn btn-sm btn-danger" type="button" id="confirm-ok">删除</button>
    </div>
  </div>
</div>

<script src="/assets/core.js"></script>
<script src="/assets/detail.js"></script>
</body>
</html>
